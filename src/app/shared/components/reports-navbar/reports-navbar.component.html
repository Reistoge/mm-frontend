<nav [class]="components.tabNav.container" aria-label="Reports">
  <button
    type="button"
    [class]="components.tabNav.item"
    [attr.aria-selected]="selectedValue() === null"
    (click)="toggle(null)"
    title="Hide selected report"
  >
    Overview
  </button>

  @for (it of items; track it.key) {
    <button
      type="button"
      [class]="components.tabNav.item"
      [attr.aria-selected]="selectedValue() === it.key"
      (click)="toggle(it.key)"
      [title]="it.hint || it.label"
    >
      {{ it.label }}
    </button>
  }
</nav>
